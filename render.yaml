services:
  - type: web
    name: appsmith
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: APPSMITH_DISABLE_EMBEDDED_CADDY
        value: true
      - key: APPSMITH_DISABLE_TELEMETRY
        value: true
      - key: APPSMITH_MAIL_ENABLED
        value: false
      - key: APPSMITH_ENCRYPTION_PASSWORD
        generateValue: true
      - key: APPSMITH_ENCRYPTION_SALT
        generateValue: true
      - key: APPSMITH_INSTANCE_NAME
        value: MyAppsmith
      - key: APPSMITH_SUPABASE_URL
        sync: false
      - key: APPSMITH_SUPABASE_KEY
        sync: false
      - key: APPSMITH_MONGODB_URI
        fromService:
          type: mongodb
          name: appsmith-mongodb
          property: connectionString
      - key: APPSMITH_REDIS_URL
        fromService:
          type: redis
          name: appsmith-redis
          property: connectionString

databases:
  - name: appsmith-mongodb
    type: mongodb
    plan: free

  - name: appsmith-redis
    type: redis
    plan: free
